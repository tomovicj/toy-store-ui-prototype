<div #cancelOrderModal id="cancel-order-modal" class="modal" tabindex="-1" aria-labelledby="cancel-order-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cancel-order-modal-label">Cancel Order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        @if (toy()) {
          <div class="alert alert-danger" role="alert">
            You are about to cancel the order for: <strong>{{ toy()!.name }}</strong>
          </div>
        }
        <p>Are you sure you want to cancel this order?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-danger" (click)="onConfirmCancel()">Cancel Order</button>
      </div>
    </div>
  </div>
</div>
