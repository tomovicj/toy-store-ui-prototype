@if (customer()) {
<div class="card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h2 class="mb-0">User Profile</h2>
    <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
      data-bs-target="#edit-profile-modal" (click)="handleEdit()">
      <i class="bi bi-pencil-square me-1"></i>Edit Profile
    </button>
  </div>
  <div class="card-body p-0">
    <ul class="list-group list-group-flush">
      <li class="list-group-item d-flex align-items-center py-3">
        <i class="bi bi-person-circle text-primary me-3 fs-5"></i>
        <div class="flex-grow-1">
          <div class="text-muted small mb-1">Name</div>
          <div class="fw-semibold">{{ customer()!.firstName + ' ' + customer()!.lastName }}</div>
        </div>
      </li>
      <li class="list-group-item d-flex align-items-center py-3">
        <i class="bi bi-envelope text-primary me-3 fs-5"></i>
        <div class="flex-grow-1">
          <div class="text-muted small mb-1">Email</div>
          <div class="fw-semibold">{{ customer()!.email }}</div>
        </div>
      </li>
      <li class="list-group-item d-flex align-items-center py-3">
        <i class="bi bi-telephone text-primary me-3 fs-5"></i>
        <div class="flex-grow-1">
          <div class="text-muted small mb-1">Phone Number</div>
          <div class="fw-semibold">{{ customer()!.phoneNumber }}</div>
        </div>
      </li>
      <li class="list-group-item d-flex align-items-center py-3">
        <i class="bi bi-geo-alt text-primary me-3 fs-5"></i>
        <div class="flex-grow-1">
          <div class="text-muted small mb-1">Address</div>
          <div class="fw-semibold">{{ customer()!.address }}</div>
        </div>
      </li>
      <li class="list-group-item d-flex align-items-center py-3">
        <i class="bi bi-star text-primary me-3 fs-5"></i>
        <div class="flex-grow-1">
          <div class="text-muted small mb-1">Favorite Category</div>
          <div class="fw-semibold">{{ customer()!.favoriteCategory }}</div>
        </div>
      </li>
    </ul>
  </div>
</div>
}
