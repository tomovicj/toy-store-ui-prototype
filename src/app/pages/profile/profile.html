<div class="card mb-3">
  <div class="card-header">
    <h2>User Profile</h2>
  </div>
  <div class="card-body">
    <p><strong>Name:</strong> {{ customer()!.firstName + ' ' + customer()!.lastName }}</p>
    <p><strong>Email:</strong> {{ customer()!.email }}</p>
    <p><strong>Phone:</strong> {{ customer()!.phoneNumber }}</p>
    <p><strong>Address:</strong> {{ customer()!.address }}</p>
    <p><strong>Favorite Category:</strong> {{ customer()!.favoriteCategory }}</p>
    <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#edit-profile-modal">
      Edit Profile
    </button>
  </div>
</div>

<app-order-table />

<!-- Modal -->
<app-edit-profile (onProfileUpdated)="loadCustomer()" />
