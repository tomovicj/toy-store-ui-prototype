<div class="mb-4 d-flex justify-content-between align-items-center">
  <h2>Toy Catalog</h2>
  <div class="d-flex justify-content-end gap-3">
    <app-toy-filter />
    <app-toy-sort />
  </div>
</div>
<div class="mb-5 d-flex flex-wrap gap-3 justify-content-center">
  @for (toy of toys() | filterToys: filterParams() | sortToys: sortOption(); track toy.id; let i = $index) {
  <app-toy-card [toy]="toy" (reserved)="onToyReserved($event)" [prioritizeImage]="i < 8" />
  }
</div>

<!-- Modal -->
<app-toy-reserved />
