<div class="mb-4 d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
  <h2 class="mb-0">Toy Catalog</h2>
  <div class="d-flex flex-row gap-3">
    <app-toy-filter />
    <app-toy-sort />
  </div>
</div>
<div class="row g-3 mb-5">
  @for (toy of toys() | filterToys: filterParams() | sortToys: sortOption(); track toy.id; let i = $index) {
  <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
    <app-toy-card [toy]="toy" (reserved)="onToyReserved($event)" [prioritizeImage]="i < 8" />
  </div>
  }
</div>

<!-- Modal -->
<app-toy-reserved />
